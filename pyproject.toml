[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chloride"
version = "0.4.2"
description = "Chloride is an AI agent, originally from TitanOS Nebula. It has migrated into a standalone agent, including integrations with other platforms."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alive-progress>=3.3.0",
    "apscheduler<4",
    "ddgs>=9.11.4",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pydantic-ai==2.42.0",
    "pydantic-ai-harness[prompt-injection-defender]==0.30.0",
    "pydantic-ai-slim[web-fetch]==2.42.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.37",
    "typer>=0.24.1",
]

[project.scripts]
chloride = "chloride.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
